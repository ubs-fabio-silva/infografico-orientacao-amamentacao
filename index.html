<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#794b9e">
<title>Amamentação: cultura, mitos e saberes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --rx:#794b9e;--rx2:#9b6cac;--lil:#e0bdec;--lc:#f7effb;
  --vd:#2e7d5b;--vc:#e7f4ee;--vm:#c0392b;--rc:#fdeceb;
  --am:#e08b00;--ac:#fff6e3;--az:#1565c0;--zc:#e9f1fb;
  --rs:#d84a75;--rsc:#fdf0f4;
  --tx:#2f2a34;--tx2:#746d7c;--bd:#ece6f0;
  --pad:clamp(14px,4vw,48px);--col:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Exo,system-ui,sans-serif;color:var(--tx);line-height:1.55;font-size:clamp(15px,.4vw + 14px,21px);background:#fff}
button,a{font:inherit}
a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--rx),var(--rx2));color:#fff;padding:14px var(--pad);box-shadow:0 3px 18px #794b9e33}
.inner,.screen>*{width:100%;max-width:var(--col);margin-left:auto;margin-right:auto}
.brand{font-weight:800}
.brand small{display:block;font-weight:400;opacity:.85;font-size:.7em}
.screen{display:none;padding:clamp(20px,3vw,42px) var(--pad) 120px}
.screen.on{display:block;animation:show .25s ease}
@keyframes show{from{opacity:0;transform:translateY(8px)}}
h1,h2{color:var(--rx);font-weight:900;line-height:1.1}
h1{font-size:clamp(30px,4vw,62px)}
h2{font-size:clamp(26px,3vw,52px);margin-bottom:8px}
.sub{color:var(--tx2);font-weight:600;margin-bottom:24px}
.sec{margin:30px auto 14px;border-bottom:2px solid var(--bd);padding-bottom:7px;color:var(--rx2);font-size:.76em;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
.menu-group{margin:28px auto}
.group-title{display:flex;align-items:center;gap:10px;color:var(--rx);font-weight:900;text-transform:uppercase;margin-bottom:12px}
.num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rx);color:#fff;font-size:16px}
.menu-card{border:2.5px solid var(--bd);background:#fff;border-radius:20px;padding:20px 14px;text-align:center;cursor:pointer;transition:.18s;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.menu-card:hover{border-color:var(--rx2);transform:translateY(-2px);box-shadow:0 8px 24px #794b9e22}
.menu-card .ico{display:block;font-size:40px;line-height:1}
.menu-card b{display:block;color:var(--rx);font-size:1.05em}
.menu-card small{color:var(--tx2);font-weight:500}
.card,.band,.chart,.condition,.myth,.linkcard{border-radius:19px;margin-bottom:16px}
.card{padding:clamp(16px,2vw,28px);border-left:6px solid var(--rx2);background:var(--lc)}
.card b{display:block;color:var(--rx);font-size:1.08em;margin-bottom:5px}
.ok{background:var(--vc);border-color:var(--vd)}.ok b{color:var(--vd)}
.warn{background:var(--ac);border-color:var(--am)}.warn b{color:#986000}
.danger{background:var(--rc);border-color:var(--vm)}.danger b{color:var(--vm)}
.info{background:var(--zc);border-color:var(--az)}.info b{color:var(--az)}
.band{display:flex;gap:15px;padding:clamp(15px,2vw,27px);background:var(--lc);align-items:center}
.band .ico{font-size:38px;flex:none}
.band b{display:block;color:var(--rx);font-size:1.07em}
.myth{overflow:hidden;border:3px solid var(--rx2)}
.myth h3{background:var(--rx);color:#fff;text-align:center;padding:16px;font-size:1.2em;font-weight:900}
.myth h3 small{display:block;font-size:.6em;letter-spacing:2px;opacity:.9}
.myth>div{background:var(--lc);padding:20px}
.myth p+p{margin-top:9px}
.hero-number{text-align:center;background:var(--lc);border:3px solid var(--rx2);padding:30px;border-radius:24px;margin-bottom:18px}
.hero-number strong{display:block;color:var(--rx);font-size:clamp(52px,7vw,120px);line-height:.9;font-weight:900}
.hero-number b{color:var(--rx);font-size:1.3em}
.icon-card{border:3px solid var(--rx2);background:var(--lc);padding:17px 9px;border-radius:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.icon-card.green{border-color:var(--vd);background:var(--vc)}.icon-card.green b{color:var(--vd)}
.icon-card.red{border-color:var(--vm);background:var(--rc)}.icon-card.red b{color:var(--vm)}
.icon-card.amber{border-color:var(--am);background:var(--ac)}.icon-card.amber b{color:#986000}
.icon-card .ico{display:block;font-size:38px}
.icon-card b{display:block;color:var(--rx)}
.icon-card small{display:block;color:var(--tx2);font-weight:600}

/* ART & SVG STYLING */
.art{width:100%;overflow:hidden;border:2px solid var(--lil);border-radius:22px;background:linear-gradient(145deg,#fcf8fd,#f4e9f9);margin-bottom:18px;box-shadow:0 4px 20px rgba(121,75,158,.08)}
.art svg{display:block;width:100%;height:auto}
.art.square{aspect-ratio:1/1;min-height:0;margin:0;border-radius:20px}
.art.clinical{background:#fff;border-color:var(--bd)}
.positions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;margin-bottom:20px}
.position{display:flex;flex-direction:column;align-items:center}
.position figcaption{text-align:center;color:var(--rx);font-weight:900;margin-top:9px;font-size:1.05em}

/* APOGEIA MINI CARDS */
.apoj-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;margin-bottom:18px}
.apoj-card{display:flex;gap:14px;align-items:center;background:var(--lc);border:2.5px solid var(--lil);border-radius:18px;padding:14px 18px}
.apoj-card .mini-art{width:80px;height:80px;flex:none;border-radius:14px;overflow:hidden;background:#fff;border:2px solid var(--rx2);display:flex;align-items:center;justify-content:center}
.apoj-card .mini-art svg{width:100%;height:100%}
.apoj-card div b{display:block;color:var(--rx);font-size:1em;line-height:1.25;margin-bottom:3px}
.apoj-card div span{font-size:.88em;color:var(--tx2);line-height:1.35;display:block}

.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:16px}
.listbox{border:3px solid var(--vd);background:var(--vc);border-radius:20px;padding:20px}
.listbox.adjust{border-color:var(--am);background:var(--ac)}
.listbox h3{text-align:center;color:var(--vd);margin-bottom:10px;font-weight:900}
.listbox.adjust h3{color:#986000}
ul.clean{list-style:none}
ul.clean li{padding:8px 0 8px 26px;border-bottom:1px solid #00000012;position:relative;font-weight:600}
ul.clean li:before{content:'✓';position:absolute;left:0;color:var(--vd);font-weight:900;font-size:18px}
.adjust ul.clean li:before{content:'!';color:var(--am);font-weight:900}

.condition{overflow:hidden;border:3px solid var(--rx2);background:#fff}
.condition>h3{padding:16px 20px;background:var(--lc);color:var(--rx);font-size:1.25em;font-weight:900}
.condition.amber{border-color:var(--am)}.condition.amber>h3{background:var(--ac);color:#986000}
.condition.red{border-color:var(--vm)}.condition.red>h3{background:var(--rc);color:var(--vm)}
.condition .body{padding:18px}

.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:15px;background:var(--rx);padding:20px;border-radius:24px;margin-bottom:18px}
.phase{text-align:center;background:var(--rx2);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center}
.bottle{width:74px;margin:0 auto 12px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.cap{height:14px;width:46px;margin:auto;background:#4e296e;border-radius:5px 5px 2px 2px}
.neck{height:16px;width:34px;margin:auto;border-left:3px solid #ffffffaa;border-right:3px solid #ffffffaa;background:rgba(255,255,255,.1)}
.jar{height:102px;border:3px solid #ffffffaa;border-radius:14px 14px 10px 10px;background:#f5e5a2;position:relative;overflow:hidden}
.jar::after{content:'';position:absolute;left:6px;top:6px;width:8px;height:65px;background:rgba(255,255,255,.45);border-radius:10px}
.phase:nth-child(2) .jar{background:#f8f2de}
.phase:nth-child(3) .jar{background:#fdfdfe}
.phase h3{text-transform:uppercase;font-size:1.05em;margin-top:6px;letter-spacing:.5px}
.phase b{display:block;margin:3px 0 6px;color:#f3d9ff;font-size:.95em}
.phase p{font-size:.88em;opacity:.95;line-height:1.35}

.stomachs{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;max-width:850px;margin:0 auto}
.stomach{text-align:center;background:var(--rx);color:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
.fruit{height:95px;display:flex;align-items:end;justify-content:center}
.f1{font-size:25px}.f2{font-size:42px}.f3{font-size:58px}.f4{font-size:76px}
.stomach .ml{color:#f3d9ff;font-weight:900;font-size:1.1em}

.prevent{display:grid;border:3px solid var(--rx);border-radius:20px;overflow:hidden;margin-bottom:16px}
.prevent h3{display:grid;place-items:center;background:var(--rx);color:#fff;padding:18px;text-align:center;font-weight:900}
.prevent>div{padding:20px;background:#fff}
.prevent p+p{margin-top:14px}
@media(min-width:620px){.prevent{grid-template-columns:26% 1fr}}

.substances{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.substance{border:3px solid var(--vm);border-radius:18px;overflow:hidden;background:#fff}
.substance.amber{border-color:var(--am)}
.substance h3{background:var(--vm);color:#fff;padding:13px;font-weight:900;font-size:1.05em}
.substance.amber h3{background:var(--am)}
.substance div{padding:14px;font-size:.95em}
.source{background:var(--lc);padding:16px;border-radius:14px;color:var(--tx2);margin:16px auto;font-size:.88em;border:2px solid var(--lil)}

.timeline{position:relative;padding-left:50px}
.timeline:before{content:'';position:absolute;left:18px;top:10px;bottom:10px;width:4px;background:linear-gradient(var(--rx),var(--lil));border-radius:4px}
.step{position:relative;margin-bottom:16px}
.step .dot{position:absolute;left:-48px;width:38px;height:38px;display:grid;place-items:center;border:4px solid var(--rx2);border-radius:50%;background:#fff;color:var(--rx);font-weight:900}
.step h3{color:var(--rx);font-weight:800}
.step div{background:var(--lc);padding:14px;border-radius:14px;margin-top:4px}

.formula-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.formula-step{text-align:center;background:var(--lc);border:2px solid var(--lil);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.formula-step svg{width:70px;height:70px}
.formula-step b{display:block;color:var(--rx);font-size:.95em}

.linkcard{display:flex;align-items:center;gap:15px;padding:18px;border:2.5px solid var(--bd);background:#fff;transition:.18s;cursor:pointer}
.linkcard:hover{border-color:var(--rx2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(121,75,158,.14)}
.linkcard .ico{font-size:36px;flex:none}
.linkcard b{display:block;color:var(--rx);font-size:1.05em}
.linkcard small{color:var(--tx2);font-weight:500}
.linkcard .arrow{margin-left:auto;color:var(--rx2);font-size:30px;font-weight:900}

.contact-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:16px}
.contact-item{background:var(--lc);border:2.5px solid var(--lil);border-radius:18px;padding:18px;text-align:center;display:block}
.contact-item .ico{font-size:36px;display:block;margin-bottom:6px}
.contact-item .tag{font-size:.8em;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.contact-item .val{font-size:1.15em;font-weight:900;color:var(--rx);line-height:1.3}

.map{overflow:hidden;border:2px solid var(--lil);border-radius:18px;margin-bottom:14px}
.map iframe{width:100%;height:clamp(220px,30vw,430px);border:0;display:block}
.footer{text-align:center;color:var(--tx2);border-top:2px solid var(--bd);padding-top:18px;margin-top:28px;font-size:.85em;line-height:1.6}

.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#fffffff9;border-top:2px solid var(--bd);padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #794b9e16}
.nav .inner{display:flex;gap:12px}
.nav button{flex:1;border:0;border-radius:14px;padding:15px;font-weight:900;cursor:pointer}
.back{background:#f2edf6;color:var(--rx);visibility:hidden}.back.show{visibility:visible}
.home{background:var(--rx);color:#fff}
.alert-block{margin-top:35px;padding-top:25px;border-top:3px solid var(--bd)}
.alert-button{width:100%;border:0;border-radius:18px;padding:20px;background:var(--vm);color:#fff;font-weight:900;cursor:pointer;font-size:1.08em}

@media(max-width:620px){
  .formula-flow{grid-template-columns:1fr 1fr}
  .band{align-items:flex-start}
}
@media(max-width:360px){
  .positions{grid-template-columns:1fr}
  .stomachs{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="inner brand" id="brand">Amamentação<small>Cultura, mitos e saberes</small></div></header>
<main id="app"></main>
<nav class="nav"><div class="inner"><button class="back" id="back">‹ Voltar</button><button class="home" id="home">🏠 Início</button></div></nav>

<script>
const C={
  rx:'#794b9e',rx2:'#9b6cac',lil:'#e0bdec',lc:'#f7effb',
  pele:'#fcd3b6',peleSombra:'#e5a887',peleEscura:'#b87352',
  cabelo:'#3d2338',cabeloLoiro:'#f5ce62',cabeloCast:'#5c3629',
  roupa:'#ffffff',roupaRosa:'#d84a75',roupaRoxa:'#794b9e',almofada:'#e66d8f',
  linha:'#2b1928',vd:'#2e7d5b',vm:'#c0392b',am:'#e08b00',az:'#1565c0'
};

const svg=(body,v='0 0 600 400')=>`<svg viewBox="${v}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}</svg>`;
const art=(body,label,cls='',v='0 0 600 400')=>`<div class="art ${cls}" role="img" aria-label="${label}">${svg(body,v)}</div>`;

/* FLORAIS E FUNDO DECORATIVO */
const florals=()=>`
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff8fc"/><stop offset="1" stop-color="#f2e2f6"/></linearGradient>
  </defs>
  <rect width="600" height="400" rx="22" fill="url(#gBg)"/>
  <!-- Ramos e folhagens -->
  <path d="M120 200 C80 120 130 50 140 20 C155 60 140 120 120 200 Z" fill="#684775" opacity=".85"/>
  <path d="M100 130 C60 115 50 80 55 65 C75 80 90 105 100 130 Z" fill="#684775" opacity=".8"/>
  <path d="M135 110 C165 95 180 65 175 50 C160 68 145 90 135 110 Z" fill="#684775" opacity=".8"/>
  
  <path d="M480 200 C520 120 470 50 460 20 C445 60 460 120 480 200 Z" fill="#684775" opacity=".85"/>
  <path d="M500 130 C540 115 550 80 545 65 C525 80 510 105 500 130 Z" fill="#684775" opacity=".8"/>
  <path d="M465 110 C435 95 420 65 425 50 C440 68 455 90 465 110 Z" fill="#684775" opacity=".8"/>
  
  <!-- Flores magenta / rosa -->
  <g transform="translate(100 90)">
    <circle cx="-12" cy="-12" r="14" fill="#cb3366"/>
    <circle cx="12" cy="-12" r="14" fill="#cb3366"/>
    <circle cx="0" cy="14" r="14" fill="#cb3366"/>
    <circle cx="0" cy="0" r="7" fill="#fcd3b6"/>
  </g>
  <g transform="translate(500 90)">
    <circle cx="-12" cy="-12" r="14" fill="#cb3366"/>
    <circle cx="12" cy="-12" r="14" fill="#cb3366"/>
    <circle cx="0" cy="14" r="14" fill="#cb3366"/>
    <circle cx="0" cy="0" r="7" fill="#fcd3b6"/>
  </g>
  <g transform="translate(300 45)">
    <circle cx="-10" cy="-10" r="10" fill="#cb3366"/>
    <circle cx="10" cy="-10" r="10" fill="#cb3366"/>
    <circle cx="0" cy="10" r="10" fill="#cb3366"/>
    <circle cx="0" cy="0" r="5" fill="#fce5cd"/>
  </g>
`;

/* 1. CAPA ESTILO EDITORIAL MATERNO */
function cover(){
  return art(`
    ${floraisCapa()}
    <!-- Almofada de amamentação Rosa -->
    <ellipse cx="300" cy="310" rx="160" ry="46" fill="#e66d8f" stroke="#2b1928" stroke-width="4.5"/>
    
    <!-- Pernas cruzadas sentada -->
    <path d="M170 340 C140 370 240 400 300 375 C360 400 460 370 430 340" fill="#f07598" stroke="#2b1928" stroke-width="4.5"/>
    <path d="M190 370 C200 410 245 400 245 385" fill="#fcd3b6" stroke="#2b1928" stroke-width="4"/>
    <path d="M410 370 C400 410 355 400 355 385" fill="#fcd3b6" stroke="#2b1928" stroke-width="4"/>

    <!-- Tronco e Mama da Mãe -->
    <path d="M225 180 C215 250 220 310 240 330 C270 340 330 340 360 330 C380 310 385 250 375 180 Z" fill="#fcd3b6" stroke="#2b1928" stroke-width="4.5"/>
    <path d="M260 215 C260 260 310 275 330 250" fill="#fcd3b6" stroke="#2b1928" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Top Branco -->
    <path d="M225 185 L285 245 L355 185 L375 220 C365 295 345 315 300 315 C255 315 235 295 225 220 Z" fill="#ffffff" stroke="#2b1928" stroke-width="4.5"/>

    <!-- Braços da Mãe segurando -->
    <path d="M225 190 C180 230 185 290 260 305" fill="none" stroke="#2b1928" stroke-width="32" stroke-linecap="round"/>
    <path d="M225 190 C180 230 185 290 260 305" fill="none" stroke="#fcd3b6" stroke-width="24" stroke-linecap="round"/>
    
    <path d="M375 190 C420 240 405 310 310 318" fill="none" stroke="#2b1928" stroke-width="32" stroke-linecap="round"/>
    <path d="M375 190 C420 240 405 310 310 318" fill="none" stroke="#fcd3b6" stroke-width="24" stroke-linecap="round"/>

    <!-- Bebê deitado mamando -->
    <g transform="translate(230 220)">
      <path d="M45 40 C75 35 125 45 130 85 C120 105 70 100 40 85 Z" fill="#b02b5a" stroke="#2b1928" stroke-width="4.5"/>
      <!-- Cabeça do Bebê -->
      <circle cx="35" cy="40" r="30" fill="#fcd3b6" stroke="#2b1928" stroke-width="4.5"/>
      <path d="M15 32 C20 15 45 15 55 25" fill="#3d2338" stroke="#2b1928" stroke-width="3"/>
      <!-- Olho fechado calmo e boquinha no peito -->
      <path d="M40 38 Q46 45 52 38" fill="none" stroke="#2b1928" stroke-width="3" stroke-linecap="round"/>
      <path d="M58 45 Q65 48 60 55" fill="none" stroke="#2b1928" stroke-width="3" stroke-linecap="round"/>
      <!-- Mãozinha do bebê -->
      <circle cx="85" cy="50" r="9" fill="#fcd3b6" stroke="#2b1928" stroke-width="3.5"/>
    </g>

    <!-- Mão da mãe apoiando as costas do bebê -->
    <path d="M275 270 C285 260 310 270 315 295" fill="none" stroke="#2b1928" stroke-width="4" stroke-linecap="round"/>

    <!-- Cabeça e Rosto da Mãe -->
    <!-- Cabelo atrás -->
    <path d="M210 110 C190 190 230 230 230 230 C250 180 230 120 230 100 Z" fill="#3d2338" stroke="#2b1928" stroke-width="4"/>
    <path d="M390 110 C410 190 370 230 370 230 C350 180 370 120 370 100 Z" fill="#3d2338" stroke="#2b1928" stroke-width="4"/>
    <!-- Pescoço e Rosto -->
    <path d="M275 130 L275 165 L325 165 L325 130 Z" fill="#fcd3b6" stroke="#2b1928" stroke-width="4"/>
    <path d="M250 90 C250 145 280 160 300 160 C320 160 350 145 350 90 C350 45 250 45 250 90 Z" fill="#fcd3b6" stroke="#2b1928" stroke-width="4.5"/>
    <!-- Cabelo frente -->
    <path d="M245 85 C255 40 345 40 355 85 C340 70 310 70 300 80 C285 70 260 70 245 85 Z" fill="#3d2338" stroke="#2b1928" stroke-width="4"/>
    <path d="M248 85 C240 125 260 140 260 140 C252 115 255 95 248 85 Z" fill="#3d2338"/>
    <!-- Expressão Facial Suave -->
    <!-- Sobrancelhas -->
    <path d="M268 85 Q278 80 286 86" fill="none" stroke="#2b1928" stroke-width="3" stroke-linecap="round"/>
    <path d="M314 86 Q322 80 332 85" fill="none" stroke="#2b1928" stroke-width="3" stroke-linecap="round"/>
    <!-- Olhos carinhosos voltados para baixo -->
    <circle cx="278" cy="94" r="3.5" fill="#2b1928"/>
    <circle cx="322" cy="94" r="3.5" fill="#2b1928"/>
    <!-- Nariz e Boca com sorriso sereno -->
    <path d="M298 94 Q302 108 296 112 L304 112" fill="none" stroke="#2b1928" stroke-width="3" stroke-linecap="round"/>

const titles={
  home:'Amamentação',first:'Os primeiros dias',phases:'Fases do leite',
  myths:'Mitos e verdades',latch:'A pega',amount:'Quanto o bebê mama',
  pain:'Quando dói',milk:'Tirar o leite',sleep:'Sono do bebê',
  returns:'Quando o leite volta',drugs:'Álcool e substâncias',formula:'Fórmula infantil',
  food:'A comida chega',alerts:'Procure a UBS',contact:'Contato'
};

const app=document.getElementById('app'),historyStack=[];let current='home';

function render(id,push=true){
  if(!screens[id])return;
  if(push&&id!==current)historyStack.push(current);
  current=id;
  app.innerHTML=`<section class="screen on" id="${id}">${screens[id]()}</section>`;
  document.getElementById('brand').innerHTML=`${titles[id]}<small>Cultura, mitos e saberes</small>`;
  document.getElementById('back').classList.toggle('show',id!=='home');
  if(id==='home')historyStack.length=0;
  window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]');
  if(b)render(b.dataset.go);
});

document.getElementById('home').onclick=()=>render('home');
document.getElementById('back').onclick=()=>render(historyStack.pop()||'home',false);

render('home',false);
</script>
