<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--rx:#794b9e;--rx2:#9b6cac;--lil:#e0bdec;--lc:#f7effb;--vd:#2e7d5b;--vc:#e7f4ee;--vm:#c0392b;--rc:#fdeceb;--am:#e08b00;--ac:#fff6e3;--az:#1565c0;--zc:#e9f1fb;--tx:#2f2a34;--tx2:#746d7c;--bd:#ece6f0;--pad:clamp(14px,4vw,48px);--col:1180px}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{font-family:Exo,system-ui,sans-serif;color:var(--tx);line-height:1.5;font-size:clamp(15px,.4vw + 14px,21px);background:#fff}button,a{font:inherit}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--rx),var(--rx2));color:#fff;padding:14px var(--pad);box-shadow:0 3px 18px #794b9e33}.inner,.screen>*{width:100%;max-width:var(--col);margin-left:auto;margin-right:auto}.brand{font-weight:800}.brand small{display:block;font-weight:400;opacity:.85;font-size:.7em}.screen{display:none;padding:clamp(20px,3vw,42px) var(--pad) 120px}.screen.on{display:block;animation:show .25s ease}@keyframes show{from{opacity:0;transform:translateY(8px)}}h1,h2{color:var(--rx);font-weight:900;line-height:1.08}h1{font-size:clamp(30px,4vw,62px)}h2{font-size:clamp(26px,3vw,52px);margin-bottom:8px}.sub{color:var(--tx2);font-weight:600;margin-bottom:24px}.sec{margin:30px auto 14px;border-bottom:2px solid var(--bd);padding-bottom:7px;color:var(--rx2);font-size:.76em;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}.menu-group{margin:28px auto}.group-title{display:flex;align-items:center;gap:10px;color:var(--rx);font-weight:900;text-transform:uppercase;margin-bottom:12px}.num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rx);color:#fff}.menu-card{border:2px solid var(--bd);background:#fff;border-radius:20px;padding:20px 14px;text-align:center;cursor:pointer;transition:.18s;min-height:150px}.menu-card:hover{border-color:var(--rx2);transform:translateY(-2px);box-shadow:0 8px 24px #794b9e22}.menu-card .ico{display:block;font-size:42px}.menu-card b{display:block;color:var(--rx);font-size:1.03em}.menu-card small{color:var(--tx2)}.card,.band,.chart,.condition,.myth,.linkcard{border-radius:19px;margin-bottom:16px}.card{padding:clamp(16px,2vw,28px);border-left:6px solid var(--rx2);background:var(--lc)}.card b{display:block;color:var(--rx);font-size:1.08em;margin-bottom:5px}.ok{background:var(--vc);border-color:var(--vd)}.ok b{color:var(--vd)}.warn{background:var(--ac);border-color:var(--am)}.warn b{color:#986000}.danger{background:var(--rc);border-color:var(--vm)}.danger b{color:var(--vm)}.info{background:var(--zc);border-color:var(--az)}.info b{color:var(--az)}.band{display:flex;gap:15px;padding:clamp(15px,2vw,27px);background:var(--lc)}.band .ico{font-size:38px;flex:none}.band b{display:block;color:var(--rx);font-size:1.07em}.myth{overflow:hidden;border:3px solid var(--rx2)}.myth h3{background:var(--rx);color:#fff;text-align:center;padding:16px;font-size:1.25em}.myth h3 small{display:block;font-size:.55em;letter-spacing:2px}.myth>div{background:var(--lc);padding:20px}.myth p+p{margin-top:9px}.hero-number{text-align:center;background:var(--lc);border:3px solid var(--rx2);padding:30px;border-radius:24px;margin-bottom:18px}.hero-number strong{display:block;color:var(--rx);font-size:clamp(52px,7vw,125px);line-height:.9}.hero-number b{color:var(--rx);font-size:1.3em}.icon-card{border:3px solid var(--rx2);background:var(--lc);padding:17px 9px;border-radius:18px;text-align:center}.icon-card.green{border-color:var(--vd);background:var(--vc)}.icon-card.red{border-color:var(--vm);background:var(--rc)}.icon-card.amber{border-color:var(--am);background:var(--ac)}.icon-card .ico{display:block;font-size:38px}.icon-card b{display:block;color:var(--rx)}.icon-card.green b{color:var(--vd)}.icon-card.red b{color:var(--vm)}.icon-card.amber b{color:#986000}.icon-card small{display:block;color:var(--tx2)}.art{width:100%;overflow:hidden;border:2px solid var(--lil);border-radius:20px;background:linear-gradient(145deg,#fbf7fd,#f0e3f7);margin-bottom:18px;min-height:220px}.art.square{aspect-ratio:1;min-height:0;margin:0}.art svg{display:block;width:100%;height:100%;min-height:inherit}.art.square svg{min-height:0}.positions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}.position figcaption{text-align:center;color:var(--rx);font-weight:900;margin-top:7px}.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:16px}.listbox{border:3px solid var(--vd);background:var(--vc);border-radius:20px;padding:20px}.listbox.adjust{border-color:var(--am);background:var(--ac)}.listbox h3{text-align:center;color:var(--vd);margin-bottom:10px}.listbox.adjust h3{color:#986000}ul.clean{list-style:none}ul.clean li{padding:8px 0 8px 25px;border-bottom:1px solid #00000012;position:relative}ul.clean li:before{content:'✓';position:absolute;left:0;color:var(--vd);font-weight:900}.adjust ul.clean li:before{content:'!';color:var(--am)}.condition{overflow:hidden;border:3px solid var(--rx2)}.condition>h3{padding:16px 20px;background:var(--lc);color:var(--rx);font-size:1.28em}.condition.amber{border-color:var(--am)}.condition.amber>h3{background:var(--ac);color:#986000}.condition.red{border-color:var(--vm)}.condition.red>h3{background:var(--rc);color:var(--vm)}.condition .body{padding:16px}.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:15px;background:var(--rx);padding:18px;border-radius:24px;margin-bottom:18px}.phase{text-align:center;background:var(--rx2);color:#fff;border-radius:18px;padding:18px}.bottle{width:72px;margin:0 auto 12px}.cap{height:14px;width:44px;margin:auto;background:#5e3680;border-radius:5px}.neck{height:16px;width:34px;margin:auto;border-left:3px solid #ffffff99;border-right:3px solid #ffffff99}.jar{height:100px;border:3px solid #ffffff99;border-radius:13px;background:#f2e3a8}.phase:nth-child(2) .jar{background:#f7f1dc}.phase:nth-child(3) .jar{background:#fff}.phase h3{text-transform:uppercase;font-size:1em}.stomachs{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;max-width:850px;margin:0 auto}.stomach{text-align:center;background:var(--rx);color:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}.fruit{height:95px;display:flex;align-items:end;justify-content:center}.f1{font-size:25px}.f2{font-size:42px}.f3{font-size:58px}.f4{font-size:76px}.stomach .ml{color:#f3d9ff;font-weight:900}.prevent{display:grid;border:3px solid var(--rx);border-radius:20px;overflow:hidden;margin-bottom:16px}.prevent h3{display:grid;place-items:center;background:var(--rx);color:#fff;padding:18px;text-align:center}.prevent>div{padding:20px}.prevent p+p{margin-top:14px}@media(min-width:620px){.prevent{grid-template-columns:26% 1fr}}.substances{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}.substance{border:3px solid var(--vm);border-radius:18px;overflow:hidden}.substance.amber{border-color:var(--am)}.substance h3{background:var(--vm);color:#fff;padding:13px}.substance.amber h3{background:var(--am)}.substance div{padding:14px}.source{background:var(--lc);padding:16px;border-radius:14px;color:var(--tx2);margin:16px auto}.timeline{position:relative;padding-left:50px}.timeline:before{content:'';position:absolute;left:18px;top:10px;bottom:10px;width:4px;background:linear-gradient(var(--rx),var(--lil))}.step{position:relative;margin-bottom:16px}.step .dot{position:absolute;left:-48px;width:38px;height:38px;display:grid;place-items:center;border:4px solid var(--rx2);border-radius:50%;background:#fff;color:var(--rx);font-weight:900}.step h3{color:var(--rx)}.step div{background:var(--lc);padding:14px;border-radius:14px}.formula-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.formula-step{text-align:center;background:var(--lc);border:2px solid var(--lil);border-radius:18px;padding:12px}.formula-step svg{width:72px;height:72px}.formula-step b{display:block;color:var(--rx)}.linkcard{display:flex;align-items:center;gap:15px;padding:18px;border:2px solid var(--bd);background:#fff;transition:.18s}.linkcard:hover{border-color:var(--rx2);transform:translateY(-2px)}.linkcard .ico{font-size:36px}.linkcard b{display:block;color:var(--rx)}.linkcard small{color:var(--tx2)}.linkcard .arrow{margin-left:auto;color:var(--rx2);font-size:30px}.map{overflow:hidden;border:2px solid var(--lil);border-radius:18px;margin-bottom:14px}.map iframe{width:100%;height:clamp(220px,30vw,430px);border:0;display:block}.footer{text-align:center;color:var(--tx2);border-top:2px solid var(--bd);padding-top:18px;margin-top:28px;font-size:.8em}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#fffffff7;border-top:2px solid var(--bd);padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #794b9e16}.nav .inner{display:flex;gap:12px}.nav button{flex:1;border:0;border-radius:14px;padding:15px;font-weight:900;cursor:pointer}.back{background:#f2edf6;color:var(--rx);visibility:hidden}.back.show{visibility:visible}.home{background:var(--rx);color:#fff}.alert-block{margin-top:35px;padding-top:25px;border-top:3px solid var(--bd)}.alert-button{width:100%;border:0;border-radius:18px;padding:20px;background:var(--vm);color:#fff;font-weight:900;cursor:pointer;font-size:1.08em}@media(max-width:620px){.formula-flow{grid-template-columns:1fr 1fr}.band{align-items:flex-start}.art{min-height:190px}}@media(max-width:360px){.positions{grid-template-columns:1fr}.stomachs{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="inner brand" id="brand">Amamentação<small>Cultura, mitos e saberes</small></div></header>
<main id="app"></main>
<nav class="nav"><div class="inner"><button class="back" id="back">‹ Voltar</button><button class="home" id="home">🏠 Início</button></div></nav>
<script>
const C={rx:'#794b9e',rx2:'#9b6cac',lil:'#e0bdec',pele:'#d99b78',pele2:'#b97458',cabelo:'#49313e',roupa:'#e8c9f1',bebe:'#fff7ed',vd:'#2e7d5b',vm:'#c0392b',am:'#e08b00',az:'#1565c0',tx:'#2f2a34'};
const svg=(body,v='0 0 600 340')=>`<svg viewBox="${v}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f7effb"/><stop offset="1" stop-color="#e8d3f2"/></linearGradient></defs>${body}</svg>`;
const person=(x=0,y=0,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="142" cy="76" r="42" fill="${C.pele}"/><path d="M101 72c4-50 76-65 91-11 5 20-3 36-8 44-4-25-20-42-42-43-18 0-31 7-41 10z" fill="${C.cabelo}"/><path d="M84 250c3-84 32-129 82-129 57 0 90 46 98 129z" fill="${C.rx}"/><path d="M108 250c8-62 22-91 53-112 33 20 52 54 61 112z" fill="${C.roupa}"/></g>`;
const baby=(x=0,y=0,s=1,r=0)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><ellipse cx="76" cy="87" rx="70" ry="43" fill="${C.bebe}" stroke="${C.rx2}" stroke-width="5"/><circle cx="125" cy="66" r="31" fill="${C.pele}"/><path d="M101 55c10-26 50-22 57 3-18-9-38-10-57-3z" fill="${C.cabelo}"/><circle cx="136" cy="67" r="3"/><path d="M28 80c22-17 45-17 68 1" fill="none" stroke="${C.rx2}" stroke-width="8" stroke-linecap="round"/></g>`;
const art=(body,label,cls='')=>`<div class="art ${cls}" role="img" aria-label="${label}">${svg(body,cls==='square'?'0 0 400 400':'0 0 600 340')}</div>`;
function cover(){return art(`<rect width="600" height="340" rx="26" fill="url(#g)"/><circle cx="505" cy="62" r="72" fill="${C.lil}" opacity=".55"/>${person(105,18,1.05)}${baby(235,150,.92,-9)}<path d="M245 245c62 35 137 28 181-18" fill="none" stroke="${C.pele}" stroke-width="22" stroke-linecap="round"/><path d="M438 198c0-26 38-30 43-5 7-25 45-21 45 5 0 30-44 55-44 55s-44-25-44-55z" fill="${C.rx}"/>`,'Mãe acolhendo e amamentando o bebê')}
function position(type){let b='<rect width="400" height="400" rx="28" fill="url(#g)"/>';if(type==='Tradicional')b+=person(22,43,.82)+baby(170,205,.72,-10);if(type==='Invertida')b+=person(48,43,.82)+baby(195,230,.62,10);if(type==='Deitada de lado')b+=`<g transform="translate(20 65) rotate(90 170 140)">${person(30,0,.72)}</g>`+baby(145,235,.68,2);if(type==='Cavalinho')b+=person(33,43,.82)+baby(216,176,.58,82);return `<figure class="position">${art(b,'Posição '+type,'square')}<figcaption>${type}</figcaption></figure>`}
function latch(){return art(`<rect width="600" height="340" rx="26" fill="#fff"/><circle cx="205" cy="170" r="112" fill="${C.pele}"/><circle cx="190" cy="170" r="42" fill="#a96f59"/><circle cx="190" cy="170" r="15" fill="#8d5748"/><path d="M372 87c72 18 116 82 93 151-26 77-113 92-178 45-36-27-47-68-31-107 18-45 60-84 116-89z" fill="${C.pele}"/><path d="M432 91c-24-34-87-43-121-5 44-8 87 3 121 5z" fill="${C.cabelo}"/><path d="M270 174c31-24 65-30 101-18-20 19-48 32-82 36" fill="#7b4055"/><circle cx="393" cy="142" r="5"/><g font-family="Exo" font-weight="800" font-size="16"><path d="M108 54l62 55" stroke="${C.vd}" stroke-width="4"/><text x="18" y="42" fill="${C.vd}">boca bem aberta</text><path d="M494 50l-70 76" stroke="${C.az}" stroke-width="4"/><text x="458" y="34" fill="${C.az}">nariz livre</text><path d="M500 280l-109-59" stroke="${C.rx}" stroke-width="4"/><text x="438" y="310" fill="${C.rx}">queixo encostado</text></g>`,'Pega com boca aberta, nariz livre e queixo encostado')}
function breast(type){let mark='',title='';if(type==='fissura'){title='Pequena fissura';mark=`<path d="M302 153l18 17-17 19 19 16" fill="none" stroke="${C.vm}" stroke-width="7"/>`}if(type==='cheio'){title='Massagem suave e alívio';mark=`<g fill="none" stroke="${C.rx}" stroke-width="7"><path d="M208 109c-39 31-44 84-9 121"/><path d="M395 109c39 31 44 84 9 121"/></g><path d="M300 234v55" stroke="${C.az}" stroke-width="7"/>`}if(type==='mastite'){title='Área avermelhada e quente';mark=`<path d="M245 90c61-34 142 6 129 75-9 46-70 65-118 37-35-20-45-82-11-112z" fill="${C.vm}" opacity=".34"/>`}return art(`<rect width="600" height="340" rx="26" fill="#fff"/><path d="M118 313c26-141 74-252 182-252s157 111 182 252" fill="${C.roupa}"/><path d="M173 282c7-110 46-181 127-181s120 71 127 181" fill="${C.pele}"/><circle cx="300" cy="173" r="48" fill="#a96f59"/><circle cx="300" cy="173" r="17" fill="#895244"/>${mark}<text x="300" y="315" text-anchor="middle" font-family="Exo" font-weight="800" fill="${C.rx}">${title}</text>`,title)}
function milking(){return art(`<rect width="600" height="340" rx="26" fill="#fff"/><path d="M64 300c23-132 78-226 177-226 104 0 157 94 179 226" fill="${C.roupa}"/><path d="M126 278c12-97 49-158 116-158 69 0 107 61 119 158" fill="${C.pele}"/><circle cx="244" cy="184" r="43" fill="#a96f59"/><circle cx="244" cy="184" r="15" fill="#895244"/><g fill="${C.pele}" stroke="${C.pele2}" stroke-width="3"><path d="M420 132c23 4 42 24 45 47 3 25-13 40-34 31-15-7-23-20-24-37-2-20-2-44 13-41z"/><path d="M405 185c-26 1-54 3-85 8l-5-25c33-10 64-17 91-19z"/><path d="M423 215c-27 4-61 4-98-1l3-24c34 1 64 0 91-3z"/></g><path d="M314 167c-15 4-27 10-38 19m48 28c-19-2-34-7-47-17" fill="none" stroke="${C.rx}" stroke-width="6"/><text x="470" y="170" font-family="Exo" font-weight="800" fill="${C.rx}">pressione e solte</text>`,'Ordenha manual')}
function afterFeed(){return art(`<rect width="600" height="340" rx="26" fill="url(#g)"/>${person(80,28,.92)}${baby(245,102,.72,72)}<path d="M270 260c65 18 119-3 143-58" fill="none" stroke="${C.pele}" stroke-width="20"/><path d="M470 90c20 20 20 49 0 70" fill="none" stroke="${C.az}" stroke-width="6"/><path d="M485 179c14 19 19 28 19 39a19 19 0 1 1-38 0c0-11 5-20 19-39z" fill="#83c9f4"/><text x="470" y="275" text-anchor="middle" font-family="Exo" font-weight="800" fill="${C.rx}">um pouco pode voltar</text>`,'Bebê no colo após a mamada')}
function plate(){return art(`<rect width="600" height="340" rx="26" fill="url(#g)"/><ellipse cx="300" cy="175" rx="180" ry="125" fill="#fff" stroke="${C.rx2}" stroke-width="12"/><path d="M300 50v250M125 175h350" stroke="#eee5f2" stroke-width="6"/><path d="M145 100c48-37 113-40 153-9-19 31-27 55-28 86-44 10-92 4-135-18z" fill="#e1aa3c"/><circle cx="200" cy="130" r="14" fill="#8a5a2d"/><circle cx="240" cy="145" r="13" fill="#8a5a2d"/><path d="M329 87c46-18 102-4 128 35-11 34-34 58-68 71-39-5-65-21-81-48z" fill="#66aa63"/><path d="M322 210c41-22 91-17 129 11-7 36-29 60-66 73-39-2-66-17-83-43z" fill="#ef825f"/><path d="M151 210c39-18 87-13 123 14-8 36-30 59-66 70-36-4-61-19-77-44z" fill="#f2d26b"/><text x="300" y="325" text-anchor="middle" font-family="Exo" font-weight="800" fill="${C.rx}">comida amassada, com cores e texturas</text>`,'Prato de comida amassada')}
const link=(ico,title,sub,href,cls='')=>`<a class="linkcard ${cls}" href="${href}" target="_blank" rel="noopener"><span class="ico">${ico}</span><span><b>${title}</b><small>${sub}</small></span><span class="arrow">›</span></a>`;
const guide=()=>link('📘','Guia Alimentar para Crianças Menores de 2 Anos','Ministério da Saúde · abrir PDF','https://bvsms.saude.gov.br/bvs/publicacoes/guia_alimentar_crianca_brasileira_versao_resumida.pdf');
const menuCard=(id,ico,t,s)=>`<button class="menu-card" data-go="${id}"><span class="ico">${ico}</span><b>${t}</b><small>${s}</small></button>`;
const screens={
home:()=>`${cover()}<h1 style="text-align:center">Amamentação</h1><p class="sub" style="text-align:center">Cultura, mitos e saberes</p><div class="menu-group"><div class="group-title"><span class="num">1</span>Os primeiros dias</div><div class="grid">${menuCard('first','🤱','Primeiros dias','A descida do leite')}${menuCard('phases','🍼','Fases do leite','Colostro até leite maduro')}${menuCard('latch','👶','A pega','Posições e sinais observáveis')}${menuCard('pain','🩹','Quando dói','Fissura, peito cheio e mastite')}</div></div><div class="menu-group"><div class="group-title"><span class="num">2</span>No dia a dia</div><div class="grid">${menuCard('amount','🍽️','Quanto mama','Fome e saciedade')}${menuCard('sleep','😴','Sono do bebê','O que é esperado')}${menuCard('returns','💧','Leite que volta','Depois da mamada')}${menuCard('milk','🤲','Tirar o leite','Ordenha manual')}</div></div><div class="menu-group"><div class="group-title"><span class="num">3</span>Dúvidas comuns</div><div class="grid">${menuCard('myths','💭','Mitos','O que não é verdade')}${menuCard('formula','🥣','Fórmula','Preparo seguro')}${menuCard('drugs','🚭','Álcool e substâncias','Riscos e orientação')}</div></div><div class="menu-group"><div class="group-title"><span class="num">4</span>Depois dos 6 meses</div><div class="grid">${menuCard('food','🥑','A comida chega','Introdução alimentar')}</div></div><div class="sec">Material oficial do Ministério da Saúde</div>${guide()}<div class="alert-block"><div class="card danger"><b>Alguma coisa não parece certa?</b>Nem tudo pode esperar a próxima consulta. Veja quais sinais pedem atendimento.</div><button class="alert-button" data-go="alerts">🚨 Ver sinais de alerta</button></div>`,
first:()=>`<h2>Os primeiros dias</h2><p class="sub">É normal ter pouco leite no começo.</p><div class="hero-number"><strong>3º–5º</strong><b>dia após o parto</b><p>É quando o leite “desce” (apojadura).</p></div><div class="band"><span class="ico">🤱</span><div><b>Pele a pele e livre demanda</b>Logo após o parto, o contato pele a pele e deixar o bebê mamar quando quiser ajudam a descida do leite.</div></div><div class="card"><b>Não se preocupe</b>Nos primeiros dias é esperado haver pouco leite. O corpo produz de acordo com o estímulo das mamadas.</div><div class="sec">Atenção ao sutiã</div><div class="card danger"><b>Evite modelos que comprimem a mama</b>Sutiãs apertados ou com aberturas que pressionam a mama podem dificultar a saída do leite.</div><div class="sec">A rede de apoio importa</div><div class="grid"><div class="icon-card green"><span class="ico">👨‍👩‍👧</span><b>Família</b><small>participa e apoia</small></div><div class="icon-card green"><span class="ico">🏥</span><b>Equipe</b><small>acolhe e orienta</small></div><div class="icon-card red"><span class="ico">🗣️</span><b>“Pitacos”</b><small>nem tudo é verdade</small></div></div>`,
phases:()=>`<h2>Fases do leite</h2><p class="sub">A aparência e a composição mudam com o tempo.</p><div class="phases"><div class="phase"><div class="bottle"><div class="cap"></div><div class="neck"></div><div class="jar"></div></div><h3>Colostro</h3><b>1º ao 6º dia</b><p>Rico em proteínas e anticorpos; mais amarelado.</p></div><div class="phase"><div class="bottle"><div class="cap"></div><div class="neck"></div><div class="jar"></div></div><h3>Transição</h3><b>6º ao 14º dia</b><p>Mais denso e volumoso, rico em nutrientes e gordura.</p></div><div class="phase"><div class="bottle"><div class="cap"></div><div class="neck"></div><div class="jar"></div></div><h3>Maduro</h3><b>Do 15º dia em diante</b><p>Esbranquiçado e adequado às necessidades do bebê.</p></div></div><div class="myth"><h3><small>PERGUNTA COMUM</small>Existe leite fraco?</h3><div><p><b>Não existe leite fraco.</b> Cor, aparência e sabor não determinam a qualidade.</p></div></div><div class="band"><span class="ico">🫗</span><div><b>O peito não é um reservatório</b>A produção e a liberação do leite acontecem também durante a mamada.</div></div>`,
myths:()=>`<h2>Mitos e verdades</h2><p class="sub">O que se ouve por aí — e o que é importante saber.</p><div class="myth"><h3><small>MITO</small>“Meu leite é fraco”</h3><div>O leite materno oferece água, nutrientes e proteção adequados ao bebê.</div></div><div class="myth"><h3><small>MITO</small>“Preciso fazer dieta restritiva”</h3><div>A alimentação da mãe não costuma causar cólica. Não exclua alimentos por conta própria.</div></div><div class="myth"><h3><small>MITO</small>“Amamentar faz o peito cair”</h3><div>A amamentação não é a principal causa da flacidez; a gestação já modifica tamanho e volume das mamas.</div></div><div class="prevent"><h3>O que pode prevenir?</h3><div><p><b>Usar sutiã confortável e com boa sustentação</b><br>Ajuda a distribuir o peso e reduzir desconfortos.</p><p><b>Manter um peso saudável</b><br>Evitar grandes oscilações ajuda a preservar a elasticidade da pele.</p></div></div><div class="card warn"><b>Cuidado com sutiã apertado</b>A compressão pode favorecer obstrução, inflamação e desconforto.</div>`,
latch:()=>`<h2>A pega</h2><p class="sub">A posição deve ser confortável para a mulher e para o bebê.</p><div class="sec">Posições possíveis</div><div class="positions">${position('Tradicional')}${position('Invertida')}${position('Deitada de lado')}${position('Cavalinho')}</div><div class="sec">Sinais observáveis</div>${latch()}<div class="duo"><div class="listbox"><h3>✓ Está indo bem</h3><ul class="clean"><li>Boca bem aberta</li><li>Pega boa parte da aréola</li><li>Queixo encostado</li><li><b>Nariz livre, afastado do peito</b></li><li>Lábio inferior virado para fora</li><li>É possível ouvir a deglutição</li><li>Não dói</li></ul></div><div class="listbox adjust"><h3>! Precisa ajustar</h3><ul class="clean"><li>Boca pouco aberta</li><li>Pega somente o mamilo</li><li>Nariz abafado</li><li>Bochecha encovada</li><li>Estalos</li><li>Mamilo sai achatado</li><li>Dor ou fissura</li></ul></div></div><div class="card ok"><b>O nariz precisa ficar livre</b>Se estiver encostado, aproxime o corpo do bebê da mãe e ajuste o posicionamento. Não empurre a mama com o dedo.</div>`,
amount:()=>`<h2>Quanto o bebê mama</h2><p class="sub">O estômago é pequeno e esvazia rapidamente.</p><div class="chart"><div class="stomachs"><div class="stomach"><div class="fruit f1">🍒</div><b>1 dia</b><span class="ml">5–7 mL</span><small>cereja</small></div><div class="stomach"><div class="fruit f2">🌰</div><b>3 dias</b><span class="ml">22–27 mL</span><small>noz</small></div><div class="stomach"><div class="fruit f3">🍑</div><b>1 semana</b><span class="ml">45–60 mL</span><small>pêssego</small></div><div class="stomach"><div class="fruit f4">🥚</div><b>1 mês</b><span class="ml">80–150 mL</span><small>ovo grande</small></div></div></div><div class="card"><b>Mamar muitas vezes não significa pouco leite</b>O bebê também pode buscar colo, aconchego e sucção para se acalmar.</div><div class="sec">Sinais de que está indo bem</div><div class="grid"><div class="icon-card green"><span class="ico">💧</span><b>Fraldas molhadas</b><small>observe a frequência</small></div><div class="icon-card green"><span class="ico">⚖️</span><b>Ganho de peso</b><small>acompanhado nas consultas</small></div><div class="icon-card green"><span class="ico">😌</span><b>Satisfação</b><small>solta o peito tranquilo</small></div></div>`,
pain:()=>`<h2>Quando dói</h2><p class="sub">Dor persistente merece avaliação.</p><div class="condition amber"><h3>🩹 Fissura — rachadura no mamilo</h3><div class="body">${breast('fissura')}<ul class="clean"><li>Varie a posição</li><li>Comece pela mama menos machucada</li><li>Procure ajuda para avaliar a pega</li></ul></div></div><div class="condition"><h3>🫗 Mama muito cheia</h3><div class="body">${breast('cheio')}<ul class="clean"><li>Mantenha a livre demanda</li><li>Faça massagem suave</li><li>Realize ordenha de alívio quando orientada</li></ul></div></div><div class="condition red"><h3>🤒 Mastite — dor, vermelhidão e febre</h3><div class="body">${breast('mastite')}<ul class="clean"><li>Procure atendimento no mesmo dia</li><li>O tratamento deve começar rapidamente</li><li>Em geral, não é necessário interromper a amamentação; siga a avaliação profissional</li></ul></div></div>`,
milk:()=>`<h2>Tirar o leite</h2><p class="sub">A ordenha manual melhora com a prática.</p>${milking()}<div class="hero-number"><strong>20–30</strong><b>minutos em cada mama</b><p>especialmente nas primeiras vezes</p></div><div class="card"><b>Tirou pouco? Isso pode acontecer</b>A quantidade retirada manualmente não mede, sozinha, a produção total.</div>`,
sleep:()=>`<h2>O sono do bebê</h2><p class="sub">Despertares noturnos são esperados nos primeiros meses.</p><div class="card"><b>Recém-nascido</b>Ciclos de aproximadamente 40–50 minutos, sem diferenciar bem dia e noite.</div><div class="timeline"><div class="step"><span class="dot">0</span><h3>Recém-nascido</h3><div>Ciclos curtos e vários despertares.</div></div><div class="step"><span class="dot">2</span><h3>2–3 meses</h3><div>O ritmo entre dia e noite começa a amadurecer.</div></div><div class="step"><span class="dot">6</span><h3>6–9 meses</h3><div>Muitas crianças passam a ter períodos noturnos mais longos.</div></div></div><div class="sec">O que ajuda</div><div class="grid"><div class="icon-card green"><span class="ico">🕗</span><b>Regularidade</b></div><div class="icon-card green"><span class="ico">🛁</span><b>Ritual calmo</b></div><div class="icon-card green"><span class="ico">🌙</span><b>Luz baixa</b></div></div>`,
returns:()=>`<h2>Quando o leite volta</h2><p class="sub">Um pouco de leite pode voltar após a mamada.</p>${afterFeed()}<div class="card"><b>Por que acontece?</b>O mecanismo que fecha a entrada do estômago ainda está amadurecendo.</div><div class="card ok"><b>Se o bebê está bem</b>Quando mama bem, ganha peso e permanece tranquilo, pequenas regurgitações costumam ser esperadas.</div><div class="sec">Procure avaliação se houver</div><div class="grid"><div class="icon-card red"><span class="ico">📉</span><b>Perda de peso</b></div><div class="icon-card red"><span class="ico">🤮</span><b>Vômito em jato</b></div><div class="icon-card red"><span class="ico">😣</span><b>Dor ou irritação</b></div></div>`,
drugs:()=>`<h2>Álcool, medicamentos e outras substâncias</h2><p class="sub">Conte à equipe sem medo: cada situação precisa de avaliação individual.</p><div class="card warn"><b>Importante</b>Substâncias podem passar para o leite e oferecer riscos. Não use medicamentos ou drogas por conta própria.</div><div class="sec">Uso contraindicado</div><div class="substances"><div class="substance"><h3>Cocaína e crack</h3><div>Se houve uso, procure orientação imediatamente. O material de referência cita suspensão por 24 horas.</div></div><div class="substance"><h3>Inalantes</h3><div>Procure a equipe imediatamente. O material de referência cita suspensão por 7 dias.</div></div><div class="substance"><h3>Heroína</h3><div>Procure atendimento imediatamente.</div></div><div class="substance"><h3>LSD</h3><div>Procure atendimento imediatamente.</div></div></div><div class="sec">Uso possivelmente perigoso</div><div class="substances"><div class="substance amber"><h3>Álcool</h3><div>A recomendação mais segura é não consumir durante a lactação.</div></div><div class="substance amber"><h3>Ayahuasca</h3><div>Necessita avaliação individual antes de amamentar.</div></div><div class="substance amber"><h3>Maconha e haxixe</h3><div>Converse com a equipe antes de amamentar.</div></div><div class="substance amber"><h3>Anfetaminas</h3><div>Evite uso recreacional e procure orientação.</div></div></div><div class="source"><b>Fonte-base:</b> Amamentação e uso de medicamentos e outras substâncias, Ministério da Saúde, 2025. Tempos de suspensão devem ser validados pela equipe antes da publicação.</div>`,
formula:()=>`<h2>Fórmula infantil</h2><p class="sub">Quando indicada, deve ser preparada exatamente conforme o rótulo e a orientação da equipe.</p><div class="hero-number"><strong>1 : 30</strong><b>Exemplo frequente</b><p>1 medida rasa para 30 mL — confirme no rótulo, pois a medida pode variar entre produtos.</p></div><div class="formula-flow"><div class="formula-step">${svg('<path d="M20 15h55l-7 65H27z" fill="#fff" stroke="#1565c0" stroke-width="5"/><path d="M29 49h38l-3 27H32z" fill="#83c9f4"/>','0 0 95 95')}<b>Água segura</b></div><div class="formula-step">${svg('<path d="M21 18c0-15 26-15 26 0S21 34 21 18zm13 17 35 45" fill="#fff" stroke="#794b9e" stroke-width="6"/><path d="M13 45h68" stroke="#c0392b" stroke-width="5"/>','0 0 95 95')}<b>Medida rasa</b></div><div class="formula-step">${svg('<path d="M18 17h59L69 80H26z" fill="#fff" stroke="#794b9e" stroke-width="5"/><path d="M28 51h39l-3 25H31z" fill="#f5e7c6"/>','0 0 95 95')}<b>Misture</b></div><div class="formula-step">${svg('<path d="M36 9h23v12H36z" fill="#794b9e"/><path d="M39 21h17v13c13 7 18 18 18 31v18H21V65c0-13 6-24 18-31z" fill="#fff" stroke="#9b6cac" stroke-width="5"/>','0 0 95 95')}<b>Ofereça na hora</b></div></div><div class="card danger"><b>Não altere a diluição</b>Mais ou menos pó que o indicado pode causar riscos. Não acrescente açúcar, mel, cereal ou engrossante sem orientação.</div>`,
food:()=>`<h2>A comida chega</h2><p class="sub">A alimentação complementar começa por volta dos 6 meses.</p>${guide()}<div class="hero-number"><strong>6</strong><b>meses</b><p>Até então, recomenda-se aleitamento materno exclusivo quando possível.</p></div>${plate()}<div class="card ok"><b>Amassada com o garfo</b>Ofereça alimentos com consistência e textura adequadas, sem liquidificar ou peneirar rotineiramente.</div><div class="sec">Pode estar no prato</div><div class="grid"><div class="icon-card green"><span class="ico">🍌</span><b>Frutas</b></div><div class="icon-card green"><span class="ico">🥕</span><b>Legumes</b></div><div class="icon-card green"><span class="ico">🍚</span><b>Arroz e feijão</b></div><div class="icon-card green"><span class="ico">🥩</span><b>Carnes</b></div><div class="icon-card green"><span class="ico">🥚</span><b>Ovo</b></div><div class="icon-card green"><span class="ico">💧</span><b>Água</b></div></div><div class="sec">Evite</div><div class="grid"><div class="icon-card red"><span class="ico">🍬</span><b>Açúcar e mel</b></div><div class="icon-card red"><span class="ico">🧃</span><b>Ultraprocessados</b></div><div class="icon-card red"><span class="ico">🥣</span><b>Engrossantes</b></div></div>`,
alerts:()=>`<h2>Procure a UBS</h2><p class="sub">Não espere a consulta marcada se algo não parece bem.</p><div class="grid"><div class="icon-card red"><span class="ico">📉</span><b>Não ganha peso</b></div><div class="icon-card red"><span class="ico">💧</span><b>Pouca urina</b></div><div class="icon-card red"><span class="ico">😴</span><b>Mama pouco ou está muito sonolento</b></div><div class="icon-card red"><span class="ico">😣</span><b>Dor intensa ou sangramento</b></div><div class="icon-card red"><span class="ico">🤒</span><b>Febre e mama dolorida</b></div><div class="icon-card red"><span class="ico">🤮</span><b>Vômitos repetidos ou em jato</b></div></div><div class="card"><b>A saúde da mãe também importa</b>Tristeza persistente, choro frequente, dificuldade de vínculo ou sensação de não dar conta merecem acolhimento.</div><a class="linkcard" href="tel:+554836219556"><span class="ico">📞</span><span><b>Ligar para a UBS</b><small>(48) 3621-9556 · ramal 9556</small></span><span class="arrow">›</span></a><button class="alert-button" data-go="contact" style="background:var(--rx)">Ver endereço e mapa</button>`,
contact:()=>`<h2>UBS Fábio Silva</h2><p class="sub">Toque para ligar ou abrir a localização.</p><a class="linkcard" href="tel:+554836219556"><span class="ico">📞</span><span><b>(48) 3621-9556</b><small>ramal 9556 · toque para ligar</small></span><span class="arrow">›</span></a>${link('📍','Rua Pedro Esmeraldino de Menezes, s/n','Bairro Fábio Silva · Tubarão/SC','https://maps.app.goo.gl/np4QbUTAV5NUutV48')}<div class="map"><iframe src="https://www.google.com/maps?q=Rua+Pedro+Esmeraldino+de+Menezes,+F%C3%A1bio+Silva,+Tubar%C3%A3o+-+SC&output=embed" loading="lazy" title="Mapa da UBS Fábio Silva"></iframe></div>${link('🗺️','Abrir no aplicativo de mapas','Traçar rota até a unidade','https://maps.app.goo.gl/np4QbUTAV5NUutV48')}${guide()}<a class="linkcard" href="tel:+554836219556"><span class="ico">🏥</span><span><b>Tire as dúvidas na unidade</b><small>toque para ligar</small></span><span class="arrow">›</span></a><div class="footer">Material educativo — <b>Mostra PMSUS 2026.2</b><br>TURMA 49B · UNISUL · UBS Fábio Silva<br>Não substitui a avaliação profissional.</div>`
};
const titles={home:'Amamentação',first:'Os primeiros dias',phases:'Fases do leite',myths:'Mitos e verdades',latch:'A pega',amount:'Quanto o bebê mama',pain:'Quando dói',milk:'Tirar o leite',sleep:'Sono do bebê',returns:'Quando o leite volta',drugs:'Álcool e substâncias',formula:'Fórmula infantil',food:'A comida chega',alerts:'Procure a UBS',contact:'Contato'};
const app=document.getElementById('app'),historyStack=[];let current='home';
function render(id,push=true){if(!screens[id])return;if(push&&id!==current)historyStack.push(current);current=id;app.innerHTML=`<section class="screen on" id="${id}">${screens[id]()}</section>`;document.getElementById('brand').innerHTML=`${titles[id]}<small>Cultura, mitos e saberes</small>`;document.getElementById('back').classList.toggle('show',id!=='home');if(id==='home')historyStack.length=0;window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)render(b.dataset.go)});document.getElementById('home').onclick=()=>render('home');document.getElementById('back').onclick=()=>render(historyStack.pop()||'home',false);render('home',false);
</script>
</body>
</html>
