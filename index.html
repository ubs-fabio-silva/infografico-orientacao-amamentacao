<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#794b9e">
<title>Amamentação: cuidado, vínculo e proteção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --rx:#794b9e;--rx2:#9b6cac;--lil:#e0bdec;--lc:#f7effb;
  --vd:#2e7d5b;--vc:#e7f4ee;--vm:#c0392b;--rc:#fdeceb;
  --am:#e08b00;--ac:#fff6e3;--az:#1565c0;--zc:#e9f1fb;
  --rs:#d84a75;--rsc:#fdf0f4;
  --tx:#2f2a34;--tx2:#746d7c;--bd:#ece6f0;
  --pad:clamp(14px,4vw,48px);--col:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Exo,system-ui,sans-serif;color:var(--tx);line-height:1.55;font-size:clamp(15px,.4vw + 14px,21px);background:#fff}
button,a{font:inherit}
a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--rx),var(--rx2));color:#fff;padding:14px var(--pad);box-shadow:0 3px 18px #794b9e33}
.inner,.screen>*{width:100%;max-width:var(--col);margin-left:auto;margin-right:auto}
.brand{font-weight:800}
.brand small{display:block;font-weight:400;opacity:.85;font-size:.7em}
.screen{display:none;padding:clamp(20px,3vw,42px) var(--pad) 120px}
.screen.on{display:block;animation:show .25s ease}
@keyframes show{from{opacity:0;transform:translateY(8px)}}
h1,h2{color:var(--rx);font-weight:900;line-height:1.1}
h1{font-size:clamp(30px,4vw,62px)}
h2{font-size:clamp(26px,3vw,52px);margin-bottom:8px}
.sub{color:var(--tx2);font-weight:600;margin-bottom:24px}
.sec{margin:30px auto 14px;border-bottom:2px solid var(--bd);padding-bottom:7px;color:var(--rx2);font-size:.76em;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
.grid + .card,.grid + .band,.positions + .card,.stomachs + .card{margin-top:18px}
.grid + .sec{margin-top:34px}
.menu-group{margin:28px auto}
.group-title{display:flex;align-items:center;gap:10px;color:var(--rx);font-weight:900;text-transform:uppercase;margin-bottom:12px}
.num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rx);color:#fff;font-size:16px}
.menu-card{border:2.5px solid var(--bd);background:#fff;border-radius:20px;padding:20px 14px;text-align:center;cursor:pointer;transition:.18s;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.menu-card:hover{border-color:var(--rx2);transform:translateY(-2px);box-shadow:0 8px 24px #794b9e22}
.menu-card .ico{display:block;font-size:40px;line-height:1}
.menu-card b{display:block;color:var(--rx);font-size:1.05em}
.menu-card small{color:var(--tx2);font-weight:500}
.card,.band,.chart,.condition,.myth,.linkcard{border-radius:19px;margin-bottom:16px}
.card{padding:clamp(16px,2vw,28px);border-left:6px solid var(--rx2);background:var(--lc)}
.card b{display:block;color:var(--rx);font-size:1.08em;margin-bottom:5px}
.ok{background:var(--vc);border-color:var(--vd)}.ok b{color:var(--vd)}
.warn{background:var(--ac);border-color:var(--am)}.warn b{color:#986000}
.danger{background:var(--rc);border-color:var(--vm)}.danger b{color:var(--vm)}
.info{background:var(--zc);border-color:var(--az)}.info b{color:var(--az)}
.band{display:flex;gap:15px;padding:clamp(15px,2vw,27px);background:var(--lc);align-items:center}
.band .ico{font-size:38px;flex:none}
.band b{display:block;color:var(--rx);font-size:1.07em}
.myth{overflow:hidden;border:3px solid var(--rx2)}
.myth h3{background:var(--rx);color:#fff;text-align:center;padding:16px;font-size:1.2em;font-weight:900}
.myth h3 small{display:block;font-size:.6em;letter-spacing:2px;opacity:.9}
.myth>div{background:var(--lc);padding:20px}
.myth p+p{margin-top:9px}
.hero-number{text-align:center;background:var(--lc);border:3px solid var(--rx2);padding:30px;border-radius:24px;margin-bottom:18px}
.hero-number strong{display:block;color:var(--rx);font-size:clamp(52px,7vw,120px);line-height:.9;font-weight:900}
.hero-number b{color:var(--rx);font-size:1.3em}
.icon-card{border:3px solid var(--rx2);background:var(--lc);padding:17px 9px;border-radius:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.icon-card.green{border-color:var(--vd);background:var(--vc)}.icon-card.green b{color:var(--vd)}
.icon-card.red{border-color:var(--vm);background:var(--rc)}.icon-card.red b{color:var(--vm)}
.icon-card.amber{border-color:var(--am);background:var(--ac)}.icon-card.amber b{color:#986000}
.icon-card .ico{display:block;font-size:38px}
.icon-card b{display:block;color:var(--rx)}
.icon-card small{display:block;color:var(--tx2);font-weight:600}
/* ESTILIZAÇÃO DAS IMAGENS */
.art-img{width:100%;height:auto;display:block;border-radius:22px;border:2px solid var(--lil);margin-bottom:18px;box-shadow:0 4px 20px rgba(121,75,158,.08);object-fit:cover}
.positions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;margin-bottom:20px}
.position{display:flex;flex-direction:column;align-items:center}
.position img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;border:2px solid var(--lil)}
.position figcaption{text-align:center;color:var(--rx);font-weight:900;margin-top:9px;font-size:1.05em}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:16px}
.listbox{border:3px solid var(--vd);background:var(--vc);border-radius:20px;padding:20px}
.listbox.adjust{border-color:var(--am);background:var(--ac)}
.listbox h3{text-align:center;color:var(--vd);margin-bottom:10px;font-weight:900}
.listbox.adjust h3{color:#986000}
ul.clean{list-style:none}
ul.clean li{padding:8px 0 8px 26px;border-bottom:1px solid #00000012;position:relative;font-weight:600}
ul.clean li:before{content:'✓';position:absolute;left:0;color:var(--vd);font-weight:900;font-size:18px}
.adjust ul.clean li:before{content:'!';color:var(--am);font-weight:900}
.stomachs{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;max-width:850px;margin:0 auto}
.stomach{text-align:center;background:var(--rx);color:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
.fruit{height:95px;display:flex;align-items:end;justify-content:center}
.f1{font-size:25px}.f2{font-size:42px}.f3{font-size:58px}.f4{font-size:76px}
.stomach .ml{color:#f3d9ff;font-weight:900;font-size:1.1em}
.linkcard{display:flex;align-items:center;gap:15px;padding:18px;border:2.5px solid var(--bd);background:#fff;transition:.18s;cursor:pointer}
.linkcard:hover{border-color:var(--rx2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(121,75,158,.14)}
.linkcard .ico{font-size:36px;flex:none}
.linkcard b{display:block;color:var(--rx);font-size:1.05em}
.linkcard small{color:var(--tx2);font-weight:500}
.linkcard .arrow{margin-left:auto;color:var(--rx2);font-size:30px;font-weight:900}
.linkcard.feature{background:var(--lc);border-color:var(--rx2);border-width:3px}
.linkcard.feature .ico{font-size:42px}
.linkcard.feature b{font-size:1.12em}
/* CARD DE AVALIAÇÃO */
.rate{display:flex;align-items:center;gap:16px;padding:clamp(18px,2vw,26px);border:3px solid var(--rs);background:var(--rsc);border-radius:19px;margin-top:18px;margin-bottom:16px;transition:.18s;cursor:pointer}
.rate:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(216,74,117,.18)}
.rate .ico{font-size:clamp(36px,4vw,48px);flex:none;line-height:1}
.rate b{display:block;color:var(--rs);font-size:1.12em;font-weight:900}
.rate small{display:block;color:var(--tx2);font-weight:600}
.rate .arrow{margin-left:auto;color:var(--rs);font-size:30px;font-weight:900}
/* QR CODE */
.qr-card{display:block;border:3px solid var(--rs);background:#fff;border-radius:22px;padding:clamp(18px,2.4vw,30px);text-align:center;margin-bottom:16px;transition:.18s}
.qr-card:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(216,74,117,.18)}
.qr-card b{display:block;color:var(--rs);font-size:1.15em;font-weight:900;margin-bottom:4px}
.qr-card .hint{display:block;color:var(--tx2);font-weight:600;font-size:.88em;margin-bottom:14px;line-height:1.4}
.qr-card img{width:clamp(170px,32vw,250px);height:auto;aspect-ratio:1/1;display:block;margin:0 auto;border:8px solid #fff;border-radius:14px;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.12)}
.qr-card .tap{display:block;margin-top:12px;color:var(--rs);font-weight:800;font-size:.85em}
/* CONTATO */
.contact-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:16px}
.contact-item{background:var(--lc);border:2.5px solid var(--lil);border-radius:18px;padding:18px;text-align:center;display:block}
.contact-item .ico{font-size:36px;display:block;margin-bottom:6px}
.contact-item .tag{font-size:.8em;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.contact-item .val{font-size:1.15em;font-weight:900;color:var(--rx);line-height:1.35}
.contact-item .days{display:block;font-size:.85em;color:var(--tx2);font-weight:700;margin-bottom:4px}
.map{overflow:hidden;border:2px solid var(--lil);border-radius:18px;margin-bottom:14px}
.map iframe{width:100%;height:clamp(220px,30vw,430px);border:0;display:block}
.footer{text-align:center;color:var(--tx2);border-top:2px solid var(--bd);padding-top:18px;margin-top:28px;font-size:.85em;line-height:1.6}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#fffffff9;border-top:2px solid var(--bd);padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #794b9e16}
.nav .inner{display:flex;gap:12px}
.nav button{flex:1;border:0;border-radius:14px;padding:15px;font-weight:900;cursor:pointer}
.back{background:#f2edf6;color:var(--rx);visibility:hidden}.back.show{visibility:visible}
.home{background:var(--rx);color:#fff}
.alert-block{margin-top:35px;padding-top:25px;border-top:3px solid var(--bd)}
.alert-button{display:block;width:100%;max-width:var(--col);margin:0 auto;border:0;border-radius:18px;padding:20px;background:var(--vm);color:#fff;font-weight:900;cursor:pointer;font-size:1.08em;text-align:center}
/* CARDS DE CONDIÇÃO — "QUANDO DÓI" */
.condition{overflow:hidden;border:3px solid var(--rx2);background:#fff}
.condition .head{display:flex;align-items:center;gap:16px;padding:clamp(14px,2vw,22px);background:var(--lc)}
.condition .head .ico{font-size:clamp(34px,4vw,54px);line-height:1;flex:none}
.condition .head b{display:block;color:var(--rx);font-size:clamp(19px,1.6vw,30px);font-weight:900;line-height:1.15}
.condition .head small{display:block;color:var(--tx2);font-weight:600;font-size:.72em;margin-top:3px}
.condition .body{padding:clamp(14px,2vw,22px)}
.condition .body img{width:100%;height:auto;display:block;border-radius:16px;border:2px solid var(--lil);margin-bottom:14px;object-fit:cover}
.condition ul.clean li{border-bottom:1px solid #00000010}
.condition ul.clean li:last-child{border-bottom:none}
.condition ul.clean li:before{color:var(--rx2)}
.condition.amber{border-color:var(--am)}
.condition.amber .head{background:var(--ac)}
.condition.amber .head b{color:#986000}
.condition.amber ul.clean li:before{color:var(--am)}
.condition.red{border-color:var(--vm)}
.condition.red .head{background:var(--rc)}
.condition.red .head b{color:var(--vm)}
.condition.red ul.clean li:before{color:var(--vm)}
.band.warn{background:var(--ac)}.band.warn b{color:#986000}
.band.info{background:var(--zc)}.band.info b{color:var(--az)}
/* PASSOS NUMERADOS */
.steps{counter-reset:s;margin-bottom:16px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--lc);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.step:before{counter-increment:s;content:counter(s);flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rx);color:#fff;font-weight:900}
.step b{display:block;color:var(--rx)}
/* LINHA DO TEMPO DA APOJADURA */
.phase-line{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-bottom:18px}
.phase-item{background:var(--rx);color:#fff;border-radius:18px;padding:16px 14px;text-align:center}
.phase-item .when{display:block;font-size:.8em;font-weight:800;color:#f3d9ff;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.phase-item b{display:block;font-size:1.05em;font-weight:900;margin-bottom:5px}
.phase-item span{display:block;font-size:.88em;line-height:1.35}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="inner brand" id="brand">Amamentação<small>Cuidado, vínculo e proteção</small></div></header>
<main id="app"></main>
<nav class="nav"><div class="inner"><button class="back" id="back">‹ Voltar</button><button class="home" id="home">🏠 Início</button></div></nav>
<script>
/* ======= LINK DO FORMULÁRIO DE AVALIAÇÃO ======= */
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSffWCld7d_QRCRgnNRRb4XHX9-cHf3e5NpfxzDRFdSbrET3pg/viewform";

/* QR local (funciona sem internet) + reserva online caso o arquivo falte */
const QR_LOCAL = "qr-avaliacao.png";
const QR_API = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=12&color=794b9e&bgcolor=ffffff&data=" + encodeURIComponent(FORM_URL);

const rateCard = (texto) => `
  <a class="rate" href="${FORM_URL}" target="_blank" rel="noopener">
    <span class="ico">⭐</span>
    <span><b>Avalie este material</b><small>${texto}</small></span>
    <span class="arrow">›</span>
  </a>
`;

const qrCard = () => `
  <a class="qr-card" href="${FORM_URL}" target="_blank" rel="noopener">
    <b>📱 Aponte a câmera do celular</b>
    <span class="hint">Leia o código para abrir a avaliação · anônimo e leva 2 minutos</span>
    <img src="${QR_LOCAL}" alt="QR Code para o formulário de avaliação do material"
         onerror="this.onerror=null;this.src='${QR_API}';">
    <span class="tap">ou toque aqui para abrir ›</span>
  </a>
`;

const screens={
home:()=>`
  <img src="capa.jpg" alt="Amamentação: cuidado, vínculo e proteção" class="art-img">
  <h1 style="text-align:center">Amamentação</h1>
  <p class="sub" style="text-align:center">Cuidado, vínculo e proteção</p>
  <div class="menu-group">
    <div class="group-title"><span class="num">1</span>Os primeiros dias</div>
    <div class="grid">
      <button class="menu-card" data-go="first"><span class="ico">🤱</span><b>Primeiros dias</b><small>A descida do leite</small></button>
      <button class="menu-card" data-go="phases"><span class="ico">🍼</span><b>Fases do leite</b><small>Colostro até leite maduro</small></button>
      <button class="menu-card" data-go="latch"><span class="ico">👶</span><b>A pega</b><small>Posições e sinais observáveis</small></button>
      <button class="menu-card" data-go="pain"><span class="ico">🩹</span><b>Quando dói</b><small>Fissura, peito cheio e mastite</small></button>
    </div>
  </div>
  <div class="menu-group">
    <div class="group-title"><span class="num">2</span>No dia a dia</div>
    <div class="grid">
      <button class="menu-card" data-go="amount"><span class="ico">🍽️</span><b>Quanto mama</b><small>Fome e saciedade</small></button>
      <button class="menu-card" data-go="returns"><span class="ico">💧</span><b>Leite que volta</b><small>Depois da mamada</small></button>
      <button class="menu-card" data-go="milk"><span class="ico">🤲</span><b>Tirar o leite</b><small>Ordenha manual</small></button>
    </div>
  </div>
  <div class="menu-group">
    <div class="group-title"><span class="num">3</span>Depois dos 6 meses</div>
    <div class="grid">
      <button class="menu-card" data-go="food"><span class="ico">🥑</span><b>A comida chega</b><small>Introdução alimentar</small></button>
    </div>
  </div>
  <div class="menu-group">
    <div class="group-title"><span class="num">4</span>Para se aprofundar</div>
    <a class="linkcard feature" href="https://bvsms.saude.gov.br/bvs/publicacoes/guia_alimentar_crianca_brasileira_versao_resumida.pdf" target="_blank" rel="noopener">
      <span class="ico">📘</span>
      <span><b>Guia Alimentar para Crianças Menores de 2 Anos</b><small>Material oficial do Ministério da Saúde · abrir PDF</small></span>
      <span class="arrow">›</span>
    </a>
  </div>
  <div class="alert-block">
    <div class="card danger">
      <b>Alguma coisa não parece certa?</b>
      Nem tudo pode esperar a próxima consulta. Se houver febre, dor intensa ou perda de peso, procure a UBS.
    </div>
    <button class="alert-button" data-go="alerts">🚨 Ver sinais de alerta</button>
  </div>
  ${rateCard('Leva 2 minutos e é anônimo · ajuda a melhorar o material')}
`,
first:()=>`
  <h2>Os primeiros dias</h2>
  <p class="sub">A apojadura — quando o leite desce.</p>

  <img src="apojadura.jpg" alt="Apojadura: a descida do leite nos primeiros dias" class="art-img">

  <div class="hero-number">
    <strong>3º–5º</strong>
    <b>dia após o parto</b>
    <p>É quando costuma ocorrer a apojadura, a descida do leite.</p>
  </div>

  <div class="card">
    <b>O que é a apojadura</b>
    Com a saída da placenta, o corpo libera prolactina e a produção de leite aumenta de forma intensa. Junto com o leite, chega mais sangue e líquido à mama — por isso ela fica cheia, quente e mais sensível. É um processo natural e temporário.
  </div>

  <div class="sec">Como o leite evolui</div>
  <div class="phase-line">
    <div class="phase-item">
      <span class="when">1º ao 2º dia</span>
      <b>Colostro</b>
      <span>Pouco volume, mas suficiente. Rico em anticorpos.</span>
    </div>
    <div class="phase-item">
      <span class="when">3º ao 5º dia</span>
      <b>Apojadura</b>
      <span>O volume aumenta rápido. A mama fica cheia e mais firme.</span>
    </div>
    <div class="phase-item">
      <span class="when">Após 48–72 h</span>
      <b>Regulação</b>
      <span>O corpo ajusta a produção à demanda do bebê.</span>
    </div>
  </div>

  <div class="sec">Sinais de que a apojadura chegou</div>
  <div class="grid">
    <div class="icon-card amber"><span class="ico">🫄</span><b>Mamas cheias</b><small>mais volumosas e firmes</small></div>
    <div class="icon-card amber"><span class="ico">🌡️</span><b>Calor local</b><small>sensação de peso</small></div>
    <div class="icon-card amber"><span class="ico">💧</span><b>Leite escorre</b><small>entre as mamadas</small></div>
    <div class="icon-card amber"><span class="ico">🎨</span><b>Leite mais claro</b><small>deixa de ser amarelado</small></div>
  </div>
  <div class="card warn">
    <b>Desconforto por 24 a 48 horas é esperado</b>
    A sensação de peso e sensibilidade costuma diminuir quando o corpo regula a produção. Dor intensa, porém, não é normal.
  </div>

  <div class="sec">O que ajuda nesse momento</div>
  <div class="steps">
    <div class="step"><div><b>Amamente em livre demanda</b>Sempre que o bebê quiser, dia e noite. O esvaziamento frequente é o que mais alivia.</div></div>
    <div class="step"><div><b>Confira a pega</b>Uma pega correta esvazia melhor a mama e previne fissuras.</div></div>
    <div class="step"><div><b>Ordenha de alívio antes da mamada</b>Retire um pouco de leite até a aréola ficar mais macia, facilitando a pega do bebê.</div></div>
    <div class="step"><div><b>Use sutiã de alças largas e firmes</b>Sustenta sem comprimir. Evite modelos apertados ou com aro.</div></div>
  </div>

  <div class="sec">O que evitar</div>
  <div class="grid">
    <div class="icon-card red"><span class="ico">⏰</span><b>Espaçar mamadas</b><small>piora o ingurgitamento</small></div>
    <div class="icon-card red"><span class="ico">🍼</span><b>Complemento sem indicação</b><small>reduz o estímulo</small></div>

const titles={
  home:'Amamentação',first:'Apojadura',phases:'Fases do leite',

  returns:'Leite que volta',milk:'Tirar o leite',food:'A comida chega',
  alerts:'Sinais de Alerta',contact:'Contato'
};
const app=document.getElementById('app'),historyStack=[];let current='home';
function render(id,push=true){
  if(!screens[id])return;
  if(push&&id!==current)historyStack.push(current);
  current=id;
  app.innerHTML=`<section class="screen on" id="${id}">${screens[id]()}</section>`;
  document.getElementById('brand').innerHTML=`${titles[id]||'Amamentação'}<small>Cuidado, vínculo e proteção</small>`;
  document.getElementById('back').classList.toggle('show',id!=='home');
  if(id==='home')historyStack.length=0;
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]');
  if(b)render(b.dataset.go);
});
document.getElementById('home').onclick=()=>render('home');
document.getElementById('back').onclick=()=>render(historyStack.pop()||'home',false);
render('home',false);
</script>
